<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="coldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="insulGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.3" />

  <!-- Heat gradient flow lines -->
  <path d="M 70 256 C 140 230, 180 280, 240 256" fill="none" stroke="url(#coldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M 272 256 C 330 230, 370 280, 442 256" fill="none" stroke="url(#warmGrad)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Building outline -->
  <g transform="translate(256, 260) scale(0.95) translate(-256, -260)">
    <!-- Roof peak -->
    <polygon points="256,100 130,200 382,200" fill="#1e293b" stroke="#64748b" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Outer wall cold side -->
    <rect x="150" y="200" width="45" height="190" fill="url(#coldGrad)" rx="4" />
    <!-- Insulation core layer -->
    <rect x="199" y="200" width="55" height="190" fill="url(#insulGrad)" rx="4" />
    <!-- Structural concrete layer -->
    <rect x="258" y="200" width="50" height="190" fill="#475569" rx="4" />
    <!-- Inner plaster warm side -->
    <rect x="312" y="200" width="50" height="190" fill="url(#warmGrad)" rx="4" />

    <!-- Thermal Physics Delta T badge -->
    <circle cx="256" cy="165" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
    <text x="256" y="174" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="900" font-size="24" text-anchor="middle">ΔT</text>

    <!-- Foundation / Plinth line -->
    <rect x="130" y="390" width="252" height="22" rx="6" fill="#334155" stroke="#475569" stroke-width="3" />
  </g>

  <!-- Heat Flux Vector Arrow -->
  <path d="M 110 440 L 390 440" stroke="url(#warmGrad)" stroke-width="8" stroke-linecap="round" />
  <polygon points="405,440 380,428 380,452" fill="#ef4444" />
  <text x="256" y="475" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="19" text-anchor="middle" letter-spacing="2">ТЕПЛОФИЗИКА БНТУ</text>
</svg>
